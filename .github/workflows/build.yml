name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: windows-latest
        strategy:
            matrix:
                configuration: [Debug, Release]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore MCP.UAssetToolkit.slnx

            - name: Build ${{ matrix.configuration }}
              run: dotnet build MCP.UAssetToolkit.slnx --configuration ${{ matrix.configuration }} --no-restore

            - name: Test ${{ matrix.configuration }}
              run: dotnet test --solution MCP.UAssetToolkit.slnx --configuration ${{ matrix.configuration }} --no-build

            - name: Publish ${{ matrix.configuration }} (Self-contained)
              if: matrix.configuration == 'Release'
              run: dotnet publish src/MCP.UAssetToolkit/MCP.UAssetToolkit.csproj --configuration ${{ matrix.configuration }} --runtime win-x64 --self-contained true --output ./artifacts/publish/${{ matrix.configuration }}

            - name: Upload ${{ matrix.configuration }} Artifacts
              if: matrix.configuration == 'Release'
              uses: actions/upload-artifact@v4
              with:
                  name: MCP-UAsset-Toolkit-${{ matrix.configuration }}-win-x64
                  path: ./artifacts/publish/${{ matrix.configuration }}
                  retention-days: 30

            - name: List build output
              run: |
                  Write-Host "Build completed for ${{ matrix.configuration }}"
                  if (Test-Path "src/MCP.UAssetToolkit/bin/${{ matrix.configuration }}/net10.0/win-x64") {
                    Get-ChildItem -Path "src/MCP.UAssetToolkit/bin/${{ matrix.configuration }}/net10.0/win-x64" -Recurse | Select-Object FullName, Length
                  }

name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    release:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore

            - name: Build Release
              run: dotnet build --configuration Release --no-restore

            - name: Test Release
              run: dotnet test --solution "MCP UAsset Toolkit.slnx" --configuration Release --no-build

            - name: Publish Self-contained executable
              run: dotnet publish "MCP UAsset Toolkit.csproj" --configuration Release --runtime win-x64 --self-contained true --output ./publish/Release

            - name: Create release archive
              run: |
                  $version = if ($env:GITHUB_REF -match 'refs/tags/(.*)') { $matches[1] } else { "dev" }
                  Compress-Archive -Path ./publish/Release/* -DestinationPath "MCP-UAsset-Toolkit-$version-win-x64.zip"

            - name: Upload Release Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: MCP-UAsset-Toolkit-Release
                  path: "*.zip"
                  retention-days: 90

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              with:
                  files: "*.zip"
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
